name: Security Audit

# Weekly dependency audit, separate from CI so advisory churn never blocks a PR.
# A new advisory in a runtime dependency turns this scheduled run red (GitHub emails
# the repo owner on a failed scheduled run), prompting a patch — but it does not hold
# up delivery. Run it on demand any time from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

jobs:
  backend:
    name: Backend audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Full report (informational, non-blocking)
        working-directory: backend
        run: npm audit || true
      - name: Fail on production high/critical
        working-directory: backend
        # Only production dependencies at high/critical turn this run red; dev/build
        # tooling advisories show in the report above but do not fail the job.
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Full report (informational, non-blocking)
        working-directory: frontend
        run: npm audit || true
      - name: Fail on production high/critical
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
